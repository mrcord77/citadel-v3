[package]
name = "citadel-envelope"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Citadel Envelope v2: X25519 + ML-KEM-768 hybrid encryption with AES-256-GCM"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrcord77/citadel-v3"
keywords = ["cryptography", "post-quantum", "encryption", "ml-kem", "hybrid"]
categories = ["cryptography"]

[lib]
name = "citadel_envelope"
path = "src/lib.rs"

[dependencies]
# ML-KEM-768 (FIPS 203) — selected RustCrypto release provider.
# Exact pin with zeroization and system randomness; deterministic access is
# exposed only through the KAT feature for final-standard vectors.
# See PROVIDER_BAKEOFF_2026.md and PROVIDER_DECISION_LOG.md.
ml-kem = { version = "=0.3.2", default-features = false, features = ["getrandom", "zeroize"] }

# X25519 ECDH - classical KEM for hybrid defense-in-depth
x25519-dalek = { version = "2", features = ["static_secrets"] }

# P-384 ECDH — classical arm of suite 0xA4 (CNSA 2.0 category 5 pairing).
# `default-features = false` deliberately: the default set pulls ecdsa + pkcs8 + pem,
# none of which this crate uses. Suite 0xA4 does ECDH and nothing else, so signing and
# key-serialization code that would otherwise land in the audit surface stays out of the
# build entirely. Feature set measured in the P1 supply-chain probe
# (eem/033R_P1_supply_chain_receipt.md): 50 crates scanned, zero advisories, and p384
# resolves onto the same RustCrypto generation ml-kem 0.3.2 already pins.
p384 = { version = "0.14", default-features = false, features = ["ecdh", "arithmetic", "alloc"] }

# Symmetric cryptography. `zeroize` is enabled down the whole cipher stack so the
# AES-GCM keyed state is ZeroizeOnDrop (028-R P3 / 029-R / 030-R — CLOSED):
# - aes 0.9 is ZeroizeOnDrop on all backends → AES round-key schedule wiped on drop.
# - polyval 0.7.3 has a top-level impl Drop (zeroize_flat_type) → GHASH H retained
#   state wiped on drop, incl. x86_64. This closed the 030-R forgery-primitive residual
#   that polyval 0.6.2 (via old aes-gcm 0.10) left open on x86 (ManuallyDrop union, no
#   Drop). See KEY_LIFECYCLE in kdf.rs.
# - ghash 0.6 + aes-gcm zeroize wipe the transient GHASH construction copies.
# The aes-gcm 0.10->0.11 bump pulls the fixed ghash 0.6 -> polyval 0.7.3. KAT/ACVP
# re-validated bit-identical after the bump.
aes-gcm = { version = "0.11", features = ["aes", "zeroize"] }
aes = { version = "0.9", features = ["zeroize"] }
ghash = { version = "0.6", features = ["zeroize"] }
polyval = { version = "0.7", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"

# Constant-time operations
subtle = "2.5"

# Secure random number generation
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

# Memory zeroing for sensitive data
zeroize = { version = "1.7", features = ["derive"] }

# Comparison-only AWS-LC provider. Optional so ordinary workspace tests and
# production builds do not compile it; enable only for the standalone provider bench.
aws-lc-rs = { version = "1.17", features = ["unstable"], optional = true }

# Direct handle on the FIPS module crate, ONLY to read the linked module version at
# runtime (packet 054). It is already in the `fips` graph transitively via aws-lc-rs,
# so this adds NO new C compilation; it is optional and gated behind `fips`, so the
# default/production graph never sees it. The `=0.13.11` exact pin is a guard in its
# own right: it blocks `cargo update` from drifting the CMVP-validated module
# (0.13.11 = AWS-LC FIPS 3.1.0, certs #5298/#5314). See backend_awslc.rs
# `fips_module_version_runtime` and tests/awslc_fips_mode.rs.
aws-lc-fips-sys = { version = "=0.13.11", optional = true }

[dev-dependencies]
hex = "0.4"
rand = "0.8"
# Property-based round-trip tests for the 0xA4 suite (spec 033 §6 "proptest").
proptest = "1"
# Re-listed so benchmarks/examples can import these crates directly
aes-gcm = { version = "0.11", features = ["aes"] }
sha2 = "0.10"
# P163: keep Criterion minimal and gated by required-features on bench targets.
criterion = { version = "0.5", default-features = false }
dudect-bencher = "0.6.0"
# Previous ML-KEM provider — kept for comparison benches only.
# See PROVIDER_DECISION_LOG.md for why it was replaced.
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768"] }
# Screening-only fourth candidate: direct deterministic API plus an upstream
# dudect harness. It is not part of production unless every frozen gate passes.
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-768"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Deterministic mode for Known Answer Tests - NEVER use in production
kat = ["ml-kem/hazmat"]
# Enable criterion benchmarks: cargo bench --features bench
bench = []
# Adversarial "ringer" suite (packet 059) — test-only, no shipping change. Combine with `fips`
# to exercise the AWS-LC backend. See tests/ringer.rs for the env volume knobs.
ringer = []
# Explicit opt-in for the AWS-LC comparison path. Never selected by default.
aws-lc-comparison = ["dep:aws-lc-rs"]
# FIPS backend dependency gate (packet 038). Selects aws-lc-rs with its FIPS module
# (aws-lc-fips-sys — a C build requiring CMake+Go+Perl; see fips-backend/SUPPLY_CHAIN.md).
# NOTHING consumes this yet: the seam's ActiveBackend alias (backend.rs, packet 037)
# still resolves to RustCryptoBackend unconditionally. Backend code attaches at 039+;
# full feature wiring and the {default,fips} build matrix land in packet 043.
fips = ["dep:aws-lc-rs", "aws-lc-rs/fips", "dep:aws-lc-fips-sys"]
# Diagnostic/timing helpers (raw component decapsulation for side-channel benches).
# NOT compiled into default/production builds: these expose unguarded intermediate
# KEM material (e.g. raw X25519 output without the contributory check) purely for
# timing isolation. Never enable in production. (020-R hardening.)
timing-diagnostics = []
# Compatibility-only V2 streaming API. New integrations must use stream_v3.
legacy-stream-v2 = []
# Compatibility-only creation of historical envelope v1 fixtures. Default
# production builds can decrypt v1 but cannot create new v1 envelopes.
legacy-envelope-v1 = []
# Enable std features
std = []

[[test]]
name = "streaming"
path = "tests/streaming.rs"
required-features = ["legacy-stream-v2"]

[[test]]
name = "production_mlkem_acvp"
path = "tests/production_mlkem_acvp.rs"
required-features = ["kat"]

[[test]]
name = "migration_v1"
path = "tests/migration_v1.rs"
required-features = ["legacy-envelope-v1"]

[[test]]
name = "v2_vector"
path = "tests/v2_vector.rs"
required-features = ["kat"]

[[test]]
name = "ringer"
path = "tests/ringer.rs"
required-features = ["ringer"]

[[bench]]
name = "timing"
harness = false

[[bench]]
name = "timing_sidechannel"
harness = false
required-features = ["timing-diagnostics"]

# NFR3 (packet 049): P-384 ECDH timing differential, RustCrypto vs AWS-LC, in one
# process on one box. Needs both the diagnostic helpers and the fips backend.
[[bench]]
name = "timing_fips_p384"
harness = false
required-features = ["timing-diagnostics", "fips"]

[[bench]]
name = "mlkem_standalone"
harness = false
required-features = ["aws-lc-comparison"]

[[bench]]
name = "comparative"
harness = false
required-features = ["bench"]

[[example]]
name = "demo"
required-features = ["std"]

[[bench]]
name = "timing_attribution"
harness = false
required-features = ["timing-diagnostics"]
