# Tier 8 — ctgrind harness. Marks Citadel's ML-KEM secret key "undefined" via a
# tiny C shim over valgrind's memcheck client requests (no crabgrind/bindgen/
# libclang — only gcc + valgrind headers). memcheck then reports any branch or
# memory access that depends on a secret byte = a constant-time violation.
#
# Build:  VALGRIND_INCLUDE=$HOME/.local/include cargo build --release --locked
# Run:    ~/.local/bin/valgrind --error-exitcode=1 --track-origins=yes \
#           ./target/release/ctgrind_harness
[package]
name = "ctgrind_harness"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[dependencies]
citadel-envelope = { path = "../../../citadel-envelope", features = ["timing-diagnostics"] }

[build-dependencies]
cc = "1"

# CT analysis MUST run on optimized code (what ships). A debug build adds
# integer-overflow-check and bounds-check branches on every arithmetic op, which
# memcheck reports as secret-dependent — false positives that have nothing to do
# with the algorithm. Release: no overflow checks, but keep debug symbols so
# memcheck maps any REAL finding to source.
[profile.release]
opt-level = 3
debug = true
overflow-checks = false
debug-assertions = false
