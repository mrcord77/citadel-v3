name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Fast gate: format, lint, compile, unit tests ──────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=1

      # Standing crypto-identity gate: the deterministic KAT/ACVP vectors are
      # feature-gated (v2_vector needs `kat`) and are otherwise skipped by the
      # workspace test above. Running them here catches AES-GCM/KDF/transcript
      # output drift from a dependency bump (e.g. aes-gcm 0.10->0.11). See eem/032.
      - name: KAT / ACVP fixed vectors (feature-gated)
        run: >
          cargo test -p citadel-envelope --features kat
          --test primitive_kat --test v2_vector --test nist_acvp_kat
          --test kat --test acvp_libcrux_kat

  # ── Volume and stress tests ──────────────────────────────────────────
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run volume and stress tests
        run: cargo test -p citadel-envelope --test security_stress -- --include-ignored --nocapture
        env:
          RUST_TEST_THREADS: "1"

  # ── Security audit ──────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Audit dependencies
        # Two scoped exceptions: advisories in the CMVP-validated aws-lc-fips-sys 0.13.11
        # pin (packet 051), NON-APPLICABLE to Citadel (no AES-CCM, no X.509/CRL); fixes exist
        # only in the unvalidated 3.4.0. See deny.toml + SUPPLY_CHAIN.md. All other advisories
        # still fail the build.
        run: cargo audit --ignore RUSTSEC-2026-0042 --ignore RUSTSEC-2026-0043

      - name: Install cargo-deny
        run: cargo install cargo-deny --quiet

      - name: Check licenses and advisories
        run: cargo deny check

  # ── Live server tests ───────────────────────────────────────────────
  live-server-tests:
    name: Live Server Tests
    runs-on: ubuntu-latest
    needs: test
    env:
      CITADEL_ENV: development
      CITADEL_ALLOW_PLAINTEXT_KEYS: "1"
      CITADEL_RATE_LIMIT_RPS: "10000"
      CITADEL_RATE_LIMIT_BURST: "20000"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cmake
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake

      - name: Build citadel-api (release)
        run: cargo build -p citadel-api --release

      - name: Set up credentials
        run: |
          MASTER_KEY=$(openssl rand -hex 32)
          API_KEY="ci-test-key-$(openssl rand -hex 4)"
          API_KEY_HASH=$(echo -n "$API_KEY" | openssl dgst -sha256 -mac HMAC -macopt hexkey:$MASTER_KEY | awk '{print $NF}')
          echo "CITADEL_MASTER_KEY=$MASTER_KEY" >> $GITHUB_ENV
          echo "CITADEL_API_KEY=$API_KEY" >> $GITHUB_ENV
          echo "CITADEL_API_KEY_HASH=$API_KEY_HASH" >> $GITHUB_ENV
          echo "CITADEL_URL=http://localhost:8443" >> $GITHUB_ENV

      # Persistence test manages its own server
      - name: Persistence / restart test
        run: |
          export CITADEL_WORKSPACE_DIR="$(pwd)"
          export CITADEL_DATA_DIR=$(mktemp -d)
          # Script path relative to repo. Adjust if scripts move.
          bash scripts/security/persistence_server_test.sh
          rm -rf "$CITADEL_DATA_DIR"

      - name: Start server
        run: |
          DATA_DIR=$(mktemp -d)
          echo "CITADEL_DATA_DIR=$DATA_DIR" >> $GITHUB_ENV
          echo "CI_DATA_DIR=$DATA_DIR" >> $GITHUB_ENV
          CITADEL_DATA_DIR=$DATA_DIR ./target/release/citadel-api > /tmp/ci-server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            curl -sf http://localhost:8443/health > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Concurrency stress (20 rounds × 10 concurrent)
        run: bash scripts/security/concurrency_stress.sh 20 10

      - name: Canary log leakage
        run: bash scripts/security/log_canary_test.sh /tmp/ci-server.log

      - name: Stop server
        if: always()
        run: |
          kill $SERVER_PID 2>/dev/null || true
          rm -rf "$CI_DATA_DIR" 2>/dev/null || true

  # ── Schemathesis API fuzzing ────────────────────────────────────────
  api-fuzzing:
    name: Schemathesis
    runs-on: ubuntu-latest
    needs: test
    env:
      CITADEL_ENV: development
      CITADEL_ALLOW_PLAINTEXT_KEYS: "1"
      CITADEL_RATE_LIMIT_RPS: "10000"
      CITADEL_RATE_LIMIT_BURST: "20000"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cmake
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake

      - name: Build citadel-api (release)
        run: cargo build -p citadel-api --release

      - name: Install schemathesis
        run: pip3 install --user schemathesis

      - name: Start server
        run: |
          MASTER_KEY=$(openssl rand -hex 32)
          API_KEY="schema-ci-key"
          API_KEY_HASH=$(echo -n "$API_KEY" | openssl dgst -sha256 -mac HMAC -macopt hexkey:$MASTER_KEY | awk '{print $NF}')
          DATA_DIR=$(mktemp -d)
          echo "CITADEL_API_KEY=$API_KEY" >> $GITHUB_ENV
          echo "CI_DATA_DIR=$DATA_DIR" >> $GITHUB_ENV
          CITADEL_MASTER_KEY=$MASTER_KEY \
          CITADEL_API_KEY_HASH=$API_KEY_HASH \
          CITADEL_DATA_DIR=$DATA_DIR \
          ./target/release/citadel-api > /tmp/schema-server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            curl -sf http://localhost:8443/health > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Schemathesis (500 examples/operation)
        run: |
          EXIT=0
          ~/.local/bin/schemathesis run scripts/security/openapi.yaml \
            --url http://localhost:8443 \
            -H "Authorization:Bearer $CITADEL_API_KEY" \
            -n 500 \
            -c not_a_server_error,status_code_conformance,response_schema_conformance \
            --no-color 2>&1 | tee /tmp/schemathesis_output.txt || EXIT=$?
          # Fail on real findings (schema violations, server errors), not transient network errors
          if grep -q "Response violates schema\|Undocumented HTTP status code" /tmp/schemathesis_output.txt; then
            echo "::error::Schemathesis found schema violations"
            exit 1
          fi
          # Network errors during CI are transient — warn but don't block
          if [ $EXIT -ne 0 ] && grep -q "Network Error" /tmp/schemathesis_output.txt; then
            echo "::warning::Schemathesis had transient network errors but no schema violations"
          elif [ $EXIT -ne 0 ]; then
            exit $EXIT
          fi

      - name: Check for 5xx in server log
        if: always()
        run: |
          if grep -qE "HTTP/[0-9.]+ 5[0-9]{2}" /tmp/schema-server.log 2>/dev/null; then
            echo "::error::5xx responses detected"
            exit 1
          fi

      - name: Stop server
        if: always()
        run: |
          kill $SERVER_PID 2>/dev/null || true
          rm -rf "$CI_DATA_DIR" 2>/dev/null || true

  # ── Docker image + compose deploy (exercises deploy/docker/, eem/032) ────
  # The jobs above build+run the citadel-api binary NATIVELY, so they never
  # exercise the Dockerfile or docker-compose.yml. This job builds the real
  # image and boots the full stack, turning the eem/030 deploy bugs (stale
  # workspace COPY list; redis crash-loop under cap_drop: ALL) into standing
  # gates instead of things an outside consumer discovers.
  docker-deploy:
    name: Docker Image & Compose Deploy
    runs-on: ubuntu-latest
    needs: test
    env:
      # `docker compose` interpolates the WHOLE compose file (including the
      # ${CITADEL_*:?...} required vars) for EVERY subcommand — build, logs, down —
      # not just `up`. So the credentials must be present before the first compose
      # call (set once via $GITHUB_ENV below). COMPOSE_FILE lets every step drop -f.
      COMPOSE_FILE: deploy/docker/docker-compose.yml
    steps:
      - uses: actions/checkout@v5

      - name: Set up credentials
        run: |
          MASTER_KEY=$(openssl rand -hex 32)
          API_KEY="ci-docker-key"
          API_KEY_HASH=$(printf '%s' "$API_KEY" \
            | openssl dgst -sha256 -mac HMAC -macopt hexkey:"$MASTER_KEY" \
            | awk '{print $NF}')
          echo "CITADEL_MASTER_KEY=$MASTER_KEY" >> "$GITHUB_ENV"
          echo "CITADEL_API_KEY_HASH=$API_KEY_HASH" >> "$GITHUB_ENV"

      # Builds through the real Dockerfile (context = repo root via ../..):
      # fails if the workspace-member COPY list or the rust pin regress.
      - name: Build image
        run: docker compose build citadel

      - name: Boot the stack
        run: docker compose up -d

      # Assert the citadel CONTAINER itself is up first — a bare /health probe can
      # false-green off some other listener on 8443 if the container never started
      # (observed locally against a stale port binding). Gate on the container, then
      # on the health body it serves.
      - name: Assert citadel container is running
        run: |
          CID=$(docker compose ps -q citadel)
          test -n "$CID"
          STATE=$(docker inspect -f '{{.State.Status}}' "$CID")
          RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$CID")
          echo "citadel state=$STATE restarts=$RESTARTS"
          test "$STATE" = "running"
          test "$RESTARTS" -lt 3

      # /health served from the CONTAINER (loopback-published on 8443).
      - name: Wait for container /health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8443/health >/dev/null 2>&1 && break
            sleep 2
          done
          BODY=$(curl -sf http://127.0.0.1:8443/health || true)
          echo "health: $BODY"
          echo "$BODY" | grep -q '"status":"ok"'

      # Directly asserts the redis compose fix: under cap_drop: ALL the
      # unmodified image crash-loops (endless restarts / not running).
      - name: Assert redis is running (not crash-looping under cap_drop ALL)
        run: |
          RID=$(docker compose ps -q redis)
          STATE=$(docker inspect -f '{{.State.Status}}' "$RID")
          RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$RID")
          echo "redis state=$STATE restarts=$RESTARTS"
          test "$STATE" = "running"
          test "$RESTARTS" -lt 3

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down -v
